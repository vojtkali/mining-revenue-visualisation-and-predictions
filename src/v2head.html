<title>{{V2_TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: calm, airy work tool for a 13–15" laptop. White top bar (machine switch + tabs), parameter card on the
   left, roomy cards on a soft grey ground on the right; below 900px the parameters fold above the content.
   One family (Geist) for text, Geist Mono for every number so columns and tiles line up. */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --raise:#f8f9fb; --line:#e5e7ec; --grid:#eef0f4;
  --fg:#11151c; --fg2:#4b5363; --muted:#8a91a0;
  --s1:#2e66f6; --s2:#f06a3e; --s3:#10a37a; --s4:#7b5ef2; --s5:#e59f2e; --chip:#fff3dc; --chipfg:#7a4f00; --ref:#a2a8b4;
  --est:rgba(229,159,46,.08); --good:#0b9b6a; --bad:#e2464b; --sel:#eef3ff;
  --shadow:0 1px 2px rgba(17,21,28,.04),0 2px 8px rgba(17,21,28,.05);
  --f-display:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --hdr:110px; --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0f14; --panel:#151920; --raise:#1a1f27; --line:#252b35; --grid:#1f242d;
  --fg:#eef1f6; --fg2:#a9b1bf; --muted:#7a8392;
  --s1:#5a88ff; --s2:#ff7b52; --s3:#2cc191; --s4:#9a86ff; --s5:#f0b14e; --chip:#352a12; --chipfg:#f3c972; --ref:#6f7787;
  --est:rgba(240,177,78,.10); --good:#34d399; --bad:#ff6b70; --sel:#18233a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0f14; --panel:#151920; --raise:#1a1f27; --line:#252b35; --grid:#1f242d;
  --fg:#eef1f6; --fg2:#a9b1bf; --muted:#7a8392;
  --s1:#5a88ff; --s2:#ff7b52; --s3:#2cc191; --s4:#9a86ff; --s5:#f0b14e; --chip:#352a12; --chipfg:#f3c972; --ref:#6f7787;
  --est:rgba(240,177,78,.10); --good:#34d399; --bad:#ff6b70; --sel:#18233a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:4px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.top-in,.tabs-in{max-width:1480px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top-in{display:flex;align-items:center;gap:12px 28px;flex-wrap:wrap;padding-block:14px 8px}
.brand{font-size:17px;font-weight:600;letter-spacing:-.015em;display:flex;gap:8px;align-items:center}
.brand::before{content:"";width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,var(--s1),var(--s3),var(--s5),var(--s1));flex:none}
.brand b,.brand a{color:var(--muted);font-weight:500;text-decoration:none}
.brand a:hover{color:var(--s1)}
.brand .sep{color:var(--line)}
.machines{display:flex;gap:2px;background:var(--bg);border-radius:10px;padding:3px}
.machines .m{padding:5px 14px;border-radius:8px;font-weight:500;font-size:14px;color:var(--fg2);text-decoration:none}
.machines .m.on{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.machines a.m:hover,.machines a.m:focus-visible{color:var(--fg)}
.machines .m.off{color:var(--muted)}
.startinfo{margin-left:auto;font:500 13px var(--f-mono);color:var(--muted);white-space:nowrap}
.startinfo b{color:var(--fg);font-weight:600}
.startinfo+.asof{margin-left:0}
.asof{margin-left:auto;font:500 13px var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:7px}
.asof::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 20%,transparent)}
.theme{display:inline-flex;align-items:center;gap:7px;background:var(--bg);border:0;border-radius:10px;padding:6px 12px 6px 10px;font-size:13.5px;font-weight:500;color:var(--fg2);cursor:pointer}
.theme:hover{color:var(--fg)}
.theme svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme .moon{display:none}
.theme[aria-pressed="true"] .moon{display:block}
.theme[aria-pressed="true"] .sun{display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs [role=tab]{background:none;border:0;border-bottom:2px solid transparent;padding:9px 4px 11px;margin-right:14px;font-weight:500;font-size:14.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs [role=tab][aria-selected=true]{color:var(--fg);border-bottom-color:var(--fg)}
.tabs [role=tab]:hover{color:var(--fg)}

/* layout */
.layout{max-width:1480px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:28px 72px;
  display:grid;grid-template-columns:292px minmax(0,1fr);gap:32px;align-items:start}
.main{min-width:0}
.panel{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;min-width:0}
.panel>*,.group>*,details.qa>*{min-width:0}

/* sidebar */
.side{position:sticky;top:calc(var(--hdr) + 20px);max-height:calc(100vh - var(--hdr) - 40px);overflow:auto;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 18px 16px;scrollbar-width:thin}
.side-toggle{display:none}
.side form{display:contents}
.sg{display:grid;gap:12px;padding-block:2px 18px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.sg h3,.sg summary{margin:0;font-size:13px;font-weight:600;color:var(--fg)}
.sg summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.sg summary::-webkit-details-marker{display:none}
.sg summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.sg[open] summary{margin-bottom:2px}
.sg[open] summary::after{transform:rotate(-135deg)}
.adv:not([open]){gap:0}
.field{display:grid;gap:5px}
.field .fl{font-size:13px;color:var(--fg2)}
.fi{display:flex;align-items:center;background:var(--raise);border:1px solid var(--line);border-radius:9px;transition:border-color .15s,box-shadow .15s}
.fi:hover{border-color:color-mix(in srgb,var(--fg2) 35%,var(--line))}
.fi:focus-within{border-color:var(--s1);box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 18%,transparent);background:var(--panel)}
.fi input,.fi select{flex:1;min-width:0;width:0;border:0;background:none;font:500 15px var(--f-mono);color:var(--fg);padding:8px 10px;outline:none}
.fi .u{font-size:12.5px;color:var(--muted);padding-right:10px;white-space:nowrap}
.fi .u:empty{display:none}
.fi select{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;color:var(--fg);padding:8px 10px;outline:0}
.fi .today{flex:none;margin:4px;border:0;border-radius:7px;background:var(--panel);box-shadow:var(--shadow);padding:4px 10px;font-size:12.5px;font-weight:500;color:var(--fg2);cursor:pointer}
.fi .today:hover{color:var(--s1)}
.hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.45}
.scens{display:grid;gap:8px}
.scen{display:grid;gap:6px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;background:var(--panel);transition:border-color .15s,background .15s}
.scen:hover{border-color:color-mix(in srgb,var(--fg2) 40%,var(--line))}
.scen.on{border-color:var(--s1);background:var(--sel);box-shadow:0 0 0 1px var(--s1)}
.scen .sn{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.scen .sn i{width:8px;height:8px;border-radius:50%;display:inline-block}
.scen .sv{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--fg2)}
.scen .sv .lbl{min-width:68px}
.scen .sv input{width:64px;font:500 14px var(--f-mono);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 7px;text-align:right}
.scen .sv input:focus{border-color:var(--s1);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 18%,transparent)}
.spec{font:12.5px var(--f-mono);color:var(--muted);margin:0 0 10px;line-height:1.5}
.reset{background:none;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px;color:var(--fg2);cursor:pointer;width:100%}
.reset:hover{border-color:var(--fg2);color:var(--fg)}

/* content */
.intro{display:grid;gap:4px;margin-top:14px}
.intro.row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
.intro h2{font-weight:600;font-size:24px;letter-spacing:-.025em;line-height:1.2;margin:0;text-wrap:balance}
.intro p{margin:0;color:var(--fg2);max-width:76ch}
.panel>.intro:first-child{margin-top:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;min-width:0;display:grid;align-content:start;gap:2px}
.kpi .l{font-size:13px;color:var(--fg2);text-wrap:balance}
.kpi .l::first-letter{text-transform:uppercase}
.kpi .v{font:600 25px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:4px;overflow-wrap:anywhere}
.kpi .s{font-size:13px;color:var(--muted);line-height:1.45}
.kpis.big .kpi{padding:20px 22px}
.kpis.big .kpi .v{font-size:34px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(480px,1fr));gap:22px;min-width:0}
section.card{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px 16px;min-width:0}
section.card h2{font-weight:600;font-size:17px;letter-spacing:-.015em;margin:0}
section.card .sub,section.card>p{color:var(--fg2);margin:6px 0 14px;max-width:78ch;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--fg2);margin:4px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:7px}
.legend i.dash{width:16px;height:2px;border-radius:0;vertical-align:middle;background:repeating-linear-gradient(90deg,var(--ref) 0 4px,transparent 4px 7px)!important}
.legend i.box{width:12px;height:12px;border-radius:3px;background:var(--est)!important;border:1px solid var(--line)}
.chart{position:relative;height:360px}
.chart.small{height:240px}
/* Monte Carlo + Horská dráha */
.mcstat{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
#mc .kpis,#ride .seg{margin-bottom:16px}
h3.ch{font-size:14px;font-weight:600;margin:6px 0 2px;color:var(--fg)}
.card .hint{margin:0 0 8px;max-width:78ch}
.card .tbl{margin-top:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-size:13px;color:var(--fg2);cursor:pointer}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--fg);border-color:var(--s1)}
.tbl{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{padding:10px 12px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);font-size:12.5px;white-space:normal;vertical-align:bottom;min-width:9ch}
thead th{border-bottom-color:var(--line)}
tbody tr:last-child td{border-bottom:0}
td:first-child,th:first-child{text-align:left}
td{font-family:var(--f-mono)} td:first-child{font-family:var(--f-body);font-weight:500}
tbody tr:hover{background:var(--raise)}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:9px;vertical-align:0}
td .s{color:var(--muted);font-size:12px;margin-left:6px}
code{font-family:var(--f-mono);font-size:13px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0 14px}
.controls label{display:grid;gap:5px;font-size:13px;color:var(--fg2);min-width:0}
.controls input{font:500 14.5px var(--f-mono);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:7px 10px;width:100%;box-sizing:border-box}
.controls input:focus{outline:none;border-color:var(--s1);box-shadow:0 0 0 3px color-mix(in srgb,var(--s1) 18%,transparent)}

/* Q&A */
.toc{display:flex;flex-wrap:wrap;gap:8px;font-size:13.5px}
.toc a{color:var(--fg2);text-decoration:none;border-radius:999px;padding:5px 12px;background:var(--panel);box-shadow:var(--shadow)}
.toc a:hover,.toc a:focus-visible{color:var(--s1)}
.qa-tools{display:flex;gap:8px}
.qa-tools button{background:var(--panel);border:0;box-shadow:var(--shadow);border-radius:9px;padding:7px 12px;font-size:13px;color:var(--fg2);cursor:pointer}
.qa-tools button:hover{color:var(--fg)}
.group{display:grid;gap:0;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:10px 24px 12px;scroll-margin-top:calc(var(--hdr) + 20px)}
.group>h2{font-weight:600;font-size:18px;letter-spacing:-.015em;margin:12px 0 6px}
details.qa{border-top:1px solid var(--line);padding-block:14px}
details.qa>summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:baseline}
details.qa>summary::-webkit-details-marker{display:none}
details.qa>summary::before{content:"";flex:none;width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-3px);transition:transform .15s}
details.qa:not([open])>summary::before{transform:rotate(-45deg)}
details.qa h3{margin:0;font:600 15.5px/1.4 var(--f-body);color:var(--fg)}
details.qa .a{color:var(--fg2);padding:8px 0 0 19px;min-width:0}
details.qa .a>p,details.qa .a>.verify{max-width:80ch}
details.qa .a p{margin:0 0 8px}
.qa .a b,.qa .a .n{color:var(--fg)}
.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.94em;white-space:nowrap}
.chip{display:inline-block;font-size:11.5px;font-weight:500;background:var(--chip);color:var(--chipfg);border-radius:6px;padding:1px 7px;margin-left:6px}
.verify{background:var(--chip);color:var(--chipfg);border-radius:9px;padding:8px 12px;font-size:13.5px;margin-top:6px}
.lead{font-size:14px;color:var(--fg2);max-width:84ch}
.notes-grid{display:grid;gap:16px}
.notes{color:var(--fg2);font-size:14px;display:grid;gap:8px;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 24px;overflow-wrap:anywhere}
.notes h3{font-size:16px;font-weight:600;color:var(--fg);margin:0 0 2px}
.notes a,.a a,.sub a{color:var(--s1);text-decoration-thickness:1px;text-underline-offset:2px}
.site-foot{color:var(--muted);font-size:13px}

/* overview page */
.overview{max-width:1240px;margin:0 auto;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:36px 72px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.overview>.intro h2{font-size:30px}
.mcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.mcard{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:22px 22px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start;min-width:0}
.mcard h2{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0}
.mcard .spec{margin:4px 0 0}
.mcard dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 16px;margin:0}
.mcard dt{font-size:12.5px;color:var(--fg2)}
.mcard dd{margin:3px 0 0;display:grid}
.mcard .big{font:600 23px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mcard .big.sm{font:600 17px/1.3 var(--f-body);padding-block:3px}
.mcard .czk{font:12.5px var(--f-mono);color:var(--muted)}
.mcard .risk{margin:0;font-size:13.5px;color:var(--fg2);padding-top:14px;border-top:1px solid var(--line)}
.mcard .open{justify-self:start;background:var(--fg);color:var(--panel);text-decoration:none;font-weight:500;font-size:14px;border-radius:10px;padding:9px 16px}
.mcard .open:hover{background:var(--s1);color:#fff}
.mcard .open.off{background:var(--bg);color:var(--muted)}
.ovstart{max-width:440px;margin-top:16px;background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.mscn:empty{display:none}
.mscn{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:0 12px;font-size:12.5px;min-width:0}
.mscn>span{padding:5px 0;border-bottom:1px solid var(--line);color:var(--fg2)}
.mscn>.h{color:var(--muted);padding-top:0}
.mscn>.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.mscn>.sel{color:var(--fg);font-weight:600}
.mscn>.sel.lab::before{content:"● ";color:var(--s1)}
.mscn>.pos{color:var(--good)} .mscn>.neg{color:var(--bad)}
.ov-body{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.cmp{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
.cmp th,.cmp td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:normal}
.cmp thead th{font:600 13.5px var(--f-body);color:var(--fg)}
.cmp tbody th{font:500 14px var(--f-body);color:var(--fg2);width:30%}
.cmp td{font-family:var(--f-body);color:var(--fg);font-weight:400}
.money{display:flex;flex-direction:column;gap:1px}
.money .usd{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.money .czk{font:400 12.5px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:1100px){.mcards{grid-template-columns:minmax(0,1fr)}.mcard dl{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.mcard dl{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* narrow screens: parameters fold above the content */
@media (max-width:900px){
  :root{--hdr:0px}
  .top{position:static}
  .asof,.startinfo{margin-left:0}
  .top-in,.tabs-in,.layout,.overview{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .layout{grid-template-columns:minmax(0,1fr);gap:18px;padding-block:18px 56px}
  .side{position:static;max-height:none;padding:0}
  .side-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:14px 16px;font-weight:600;cursor:pointer}
  .side-toggle::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg)}
  .side.open .side-toggle::after{transform:rotate(-135deg)}
  .side-body{display:none;padding:0 16px 14px}
  .side.open .side-body{display:block}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .chart{height:290px}
  .kpis.big .kpi .v{font-size:27px}
  section.card{padding:18px 16px 12px}
  .group{padding-inline:16px}
  .intro h2{font-size:21px}
  .overview>.intro h2{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
