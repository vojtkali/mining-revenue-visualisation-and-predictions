name: Dlouhá historie sítí (kalibrace hashrate)

# Fetches the long daily history used to calibrate how network hashrate follows miner revenue.
# Runs on demand, or when the fetch script or this workflow change on a branch; commits the data to that branch.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [scripts/fetch_history.py, .github/workflows/history.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch daily history from Coin Metrics
        run: python3 scripts/fetch_history.py
      - name: Commit to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source/history.json
          if git diff --cached --quiet; then echo 'nothing changed'; exit 0; fi
          git commit -m "Dlouhá historie sítí $(date -u +%F)"
          git push origin HEAD:${GITHUB_REF_NAME}
