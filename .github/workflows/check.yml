name: Validate mining model
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.64.0 chart.js@4.4.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/economics.test.cjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/build_site.py --pages-only
      - run: node scripts/harvest.js
      - run: python3 scripts/build_site.py
      - run: node tests/browser.cjs
      - name: Check generated artifacts are reproducible
        run: git diff --exit-code -- docs data/derived/harvest.json
